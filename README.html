
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบส่งงานนักศึกษา | Digital Business Innovation</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #f7f9fc;
            --card-bg: #ffffff;
            --primary-color: #6c5ce7;
            --primary-hover: #5b4bc4;
            --accent-color: #00b894;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --border-color: #dfe6e9;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Prompt', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(#dfe6e9 1px, transparent 1px),
                radial-gradient(#dfe6e9 1px, var(--bg-color) 1px);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 480px;
            padding: 40px 30px;
            border-radius: var(--radius);
            box-shadow: 0 10px 30px rgba(108, 92, 231, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.8);
            position: relative;
            overflow: hidden;
        }

        .container::before {
            content: '</>';
            position: absolute;
            top: 20px;
            right: 25px;
            font-family: 'Fira Code', monospace;
            font-size: 14px;
            color: var(--primary-color);
            opacity: 0.4;
            letter-spacing: 1px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo-img {
            width: 70px;
            height: 70px;
            object-fit: contain;
            margin-bottom: 12px;
            border-radius: 50%;
            padding: 5px;
            background: #f1f2f6;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03);
        }

        .header h1 {
            font-size: 22px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"],
        input[type="url"],
        select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            background: #fafbfc;
        }

        input:focus, select:focus {
            border-color: var(--primary-color);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.1);
        }

        input[readonly] {
            color: var(--text-muted);
            cursor: not-allowed;
            background: #f1f2f6;
        }

        .status-box {
            padding: 10px 13px;
            border-radius: 9px;
            font-size: 13px;
            margin-top: 8px;
            background: #f1f2f6;
            color: var(--text-muted);
        }

        .status-box.pending {
            background: #fff7e6;
            color: #b7791f;
        }

        .status-box.done {
            background: #e8f8f2;
            color: #008b68;
        }

        .status-box.error {
            background: #fff0f0;
            color: #d63031;
        }

        .file-upload-box {
            border: 2px dashed var(--border-color);
            padding: 20px;
            text-align: center;
            border-radius: 10px;
            cursor: pointer;
            background: #fafbfc;
            transition: 0.3s;
        }

        .file-upload-box:hover {
            border-color: var(--primary-color);
            background: rgba(108, 92, 231, 0.02);
        }

        .file-upload-box p {
            font-size: 13px;
            color: var(--text-muted);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: var(--primary-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3);
            margin-top: 10px;
        }

        .submit-btn:hover:not(:disabled) {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(108, 92, 231, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
            box-shadow: none;
        }

        .footer-note {
            text-align: center;
            margin-top: 25px;
            font-size: 12px;
            color: var(--text-muted);
            font-family: 'Fira Code', monospace;
        }

        .refresh-note {
            margin-top: 6px;
            font-size: 11px;
            color: #9aa3a8;
        }

        @media (max-width: 480px) {
            .container {
                padding: 35px 22px;
            }

            .header h1 {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>
    <div class="container">

        <div class="header">
            <img
                src="https://lh3.googleusercontent.com/d/1-kS8V_7MBTRBnByaI4U7m4HSz3lX3PoU"
                alt="University Logo"
                class="logo-img"
                onerror="this.src='https://via.placeholder.com/70?text=LOGO'"
            >

            <h1>Assignment Submission</h1>
            <p>Digital Business Innovation IT</p>
        </div>

        <form id="submitForm">

            <div class="form-group">
                <label for="studentId">📌 รหัสนักศึกษา</label>
                <select id="studentId" required disabled>
                    <option value="">กำลังโหลดรายชื่อนักศึกษา...</option>
                </select>
            </div>

            <div class="form-group">
                <label for="studentName">👤 ชื่อ - นามสกุล</label>
                <input
                    type="text"
                    id="studentName"
                    placeholder="ระบบจะแสดงชื่ออัตโนมัติ"
                    readonly
                    required
                >
                <div id="studentStatus" class="status-box">
                    กรุณาเลือกรหัสนักศึกษา
                </div>
            </div>

            <div class="form-group">
                <label for="assignmentName">📂 เลือกชื่องาน</label>
                <select id="assignmentName" required>
                    <option value="Week 5">Week 5</option>
                </select>
            </div>

            <div class="form-group">
                <label for="workLink">🔗 ลิงก์ผลงาน (Google Drive / GitHub / อื่นๆ)</label>
                <input
                    type="url"
                    id="workLink"
                    placeholder="https://..."
                    required
                >
            </div>

            <button type="submit" class="submit-btn" id="submitButton" disabled>
                🚀 ส่งงานเข้าระบบ
            </button>

        </form>

        <div class="footer-note">
            <div id="loadStatus">System Status: Connecting...</div>
            <div class="refresh-note">Automatic synchronization enabled</div>
        </div>

    </div>

    <script>
        // ==========================================
        // SYSTEM CONFIGURATION
        // ==========================================

        const API_URL =
            'https://owl-assignment-bot.bewrattanasri24.workers.dev';

        const SUBJECT = 'DBI223-224';
        const ASSIGNMENT = 'Week 5';

        const REFRESH_INTERVAL = 15000;

        // ==========================================
        // ELEMENTS
        // ==========================================

        const form = document.getElementById('submitForm');
        const studentSelect = document.getElementById('studentId');
        const studentName = document.getElementById('studentName');
        const studentStatus = document.getElementById('studentStatus');
        const workLink = document.getElementById('workLink');
        const submitButton = document.getElementById('submitButton');
        const loadStatus = document.getElementById('loadStatus');

        let students = [];
        let isSubmitting = false;

        // ==========================================
        // LOAD STUDENTS FROM GOOGLE SHEETS
        // ==========================================

        async function loadStudents() {
            try {
                const response = await fetch(
                    `${API_URL}/students`,
                    {
                        method: 'GET',
                        cache: 'no-store'
                    }
                );

                if (!response.ok) {
                    throw new Error('ไม่สามารถเชื่อมต่อระบบข้อมูลได้');
                }

                const result = await response.json();

                if (!result.ok || !Array.isArray(result.students)) {
                    throw new Error('รูปแบบข้อมูลไม่ถูกต้อง');
                }

                students = result.students;

                const previousId = studentSelect.value;

                studentSelect.innerHTML =
                    '<option value="">-- เลือกรหัสนักศึกษา --</option>';

                students.forEach(student => {
                    const option = document.createElement('option');

                    option.value = String(student.studentId);
                    option.textContent =
                        `${student.studentId} - ${student.studentName}`;

                    option.dataset.name = student.studentName;
                    option.dataset.status = student.status;

                    studentSelect.appendChild(option);
                });

                studentSelect.disabled = false;

                if (previousId) {
                    studentSelect.value = previousId;
                    updateStudentInfo();
                }

                loadStatus.textContent =
                    'System Status: Connected & Ready ✨';

                updateStudentInfo();

            } catch (error) {
                console.error('Load students error:', error);

                loadStatus.textContent =
                    'System Status: Connection Error';

                studentSelect.innerHTML =
                    '<option value="">โหลดข้อมูลไม่สำเร็จ กรุณาลองใหม่</option>';

                studentSelect.disabled = true;
                submitButton.disabled = true;
            }
        }

        // ==========================================
        // UPDATE STUDENT INFORMATION
        // ==========================================

        function updateStudentInfo() {
            const selectedId = studentSelect.value;

            const student = students.find(
                item => String(item.studentId) === selectedId
            );

            if (!student) {
                studentName.value = '';
                studentStatus.textContent =
                    'กรุณาเลือกรหัสนักศึกษา';

                studentStatus.className = 'status-box';
                submitButton.disabled = true;
                return;
            }

            studentName.value = student.studentName;

            if (student.status === 'ส่งแล้ว') {
                studentStatus.textContent =
                    '✅ สถานะ: ส่งงานแล้ว ไม่สามารถส่งซ้ำได้';

                studentStatus.className = 'status-box done';
                submitButton.disabled = true;

            } else {
                studentStatus.textContent =
                    '⏳ สถานะ: ยังไม่ส่ง สามารถส่งงานได้';

                studentStatus.className = 'status-box pending';
                submitButton.disabled = false;
            }
        }

        studentSelect.addEventListener(
            'change',
            updateStudentInfo
        );

        // ==========================================
        // SUBMIT ASSIGNMENT
        // ==========================================

        form.addEventListener('submit', async function(event) {
            event.preventDefault();

            if (isSubmitting) return;

            const selectedId = studentSelect.value;

            const student = students.find(
                item => String(item.studentId) === selectedId
            );

            if (!student) {
                alert('กรุณาเลือกรหัสนักศึกษา');
                return;
            }

            if (student.status === 'ส่งแล้ว') {
                alert('นักศึกษารหัสนี้ส่งงานเรียบร้อยแล้ว');
                updateStudentInfo();
                return;
            }

            const link = workLink.value.trim();

            if (!link) {
                alert('กรุณากรอกลิงก์ผลงาน');
                return;
            }

            isSubmitting = true;
            submitButton.disabled = true;
            submitButton.textContent = '⏳ กำลังส่งงาน...';

            try {
                const response = await fetch(
                    `${API_URL}/submit`,
                    {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            studentId: student.studentId,
                            studentName: student.studentName,
                            subject: SUBJECT,
                            assignmentName: ASSIGNMENT,
                            workLink: link
                        })
                    }
                );

                const result = await response.json();

                if (!response.ok || !result.ok) {
                    throw new Error(
                        result.message || 'ระบบไม่สามารถบันทึกข้อมูลได้'
                    );
                }

                alert(
                    '🎉 ส่งงานเรียบร้อยแล้ว!\n\n' +
                    'ระบบบันทึกข้อมูลและส่งการแจ้งเตือนแล้ว'
                );

                workLink.value = '';

                await loadStudents();

                studentSelect.value = selectedId;
                updateStudentInfo();

            } catch (error) {
                console.error('Submit error:', error);

                alert(
                    '❌ ส่งงานไม่สำเร็จ\n\n' +
                    error.message +
                    '\n\nกรุณาตรวจสอบการเชื่อมต่อแล้วลองอีกครั้ง'
                );

                submitButton.disabled = false;

            } finally {
                isSubmitting = false;
                submitButton.textContent = '🚀 ส่งงานเข้าระบบ';

                updateStudentInfo();
            }
        });

        // ==========================================
        // AUTOMATIC DATA REFRESH
        // ==========================================

        loadStudents();

        setInterval(() => {
            if (!isSubmitting) {
                loadStudents();
            }
        }, REFRESH_INTERVAL);

    </script>
</body>
</html>
