
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBI223-224 Student Assignment Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  padding:25px 15px;
  font-family:'Prompt',sans-serif;
  background:linear-gradient(135deg,#f4efff,#e8e5ff);
  color:#30264a;
}
.container{
  max-width:650px;
  margin:auto;
  background:white;
  padding:30px;
  border-radius:22px;
  box-shadow:0 10px 35px #51408020;
}
h1{text-align:center;color:#7354b8;font-size:25px}
.subtitle{text-align:center;color:#827895;margin-bottom:25px}
label{display:block;margin:16px 0 7px;font-weight:500}
input,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd5ef;
  border-radius:10px;
  font-family:inherit;
  font-size:15px;
  background:#fff;
}
input[readonly]{background:#f5f2fb;color:#65577f}
button{
  width:100%;
  margin-top:22px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#7957bd;
  color:white;
  font-family:inherit;
  font-size:16px;
  font-weight:600;
  cursor:pointer;
}
button:disabled{opacity:.55;cursor:not-allowed}
.status{
  margin-top:15px;
  padding:12px;
  border-radius:10px;
  background:#f5f2fb;
  text-align:center;
  font-size:14px;
}
.note{font-size:13px;color:#887e9a;text-align:center;margin-top:18px}
.error{color:#c0392b}
.success{color:#218653}
</style>
</head>

<body>
<div class="container">
  <h1>🦉 Student Assignment Hub</h1>
  <div class="subtitle">DBI223-224 ระบบส่งงานนักศึกษา</div>

  <div id="loadStatus" class="status">กำลังโหลดรายชื่อนักศึกษาจาก Google Sheets...</div>

  <form id="submitForm">
    <label for="studentSelect">👤 เลือกรายชื่อนักศึกษา</label>
    <select id="studentSelect" required disabled>
      <option value="">กำลังโหลดข้อมูล...</option>
    </select>

    <label for="studentId">📌 รหัสนักศึกษา</label>
    <input id="studentId" type="text" readonly required>

    <label for="studentName">👤 ชื่อ - นามสกุล</label>
    <input id="studentName" type="text" readonly required>

    <label for="studentStatus">📋 สถานะการส่งงาน</label>
    <input id="studentStatus" type="text" readonly>

    <label for="assignmentName">📝 ชื่องาน</label>
    <select id="assignmentName" required>
      <option value="Week 5">Week 5</option>
    </select>

    <label for="workLink">🔗 ลิงก์ผลงาน</label>
    <input id="workLink" type="url" placeholder="https://..." required>

    <button id="submitButton" type="submit" disabled>ส่งงาน</button>
  </form>

  <div class="note">กำหนดส่ง 13/11/2569 · DBI223-224</div>
</div>

<script>
const API_URL = "https://owl-assignment-bot.bewrattanasri24.workers.dev";

const studentSelect = document.getElementById("studentSelect");
const studentId = document.getElementById("studentId");
const studentName = document.getElementById("studentName");
const studentStatus = document.getElementById("studentStatus");
const loadStatus = document.getElementById("loadStatus");
const submitButton = document.getElementById("submitButton");

let students = [];

function getField(obj, keys) {
  for (const key of keys) {
    if (obj[key] !== undefined && obj[key] !== null) return obj[key];
  }
  return "";
}

function normalizeStatus(value) {
  const s = String(value || "").trim();
  return s === "ส่งแล้ว" ? "ส่งแล้ว" : "ยังไม่ส่ง";
}

async function loadStudents() {
  try {
    loadStatus.textContent = "กำลังโหลดรายชื่อนักศึกษา...";
    const response = await fetch(API_URL + "/students");
    if (!response.ok) throw new Error("โหลดข้อมูลไม่สำเร็จ");

    const result = await response.json();
    students = Array.isArray(result) ? result : result.students;

    if (!Array.isArray(students)) {
      throw new Error(result.message || "ไม่พบรายการนักศึกษาใน Google Sheets");
    }

    studentSelect.innerHTML = '<option value="">-- เลือกรายชื่อของคุณ --</option>';

    students.forEach((s, index) => {
      const id = String(getField(s, ["id","studentId","studentID","รหัสนักศึกษา"])).trim();
      const name = String(getField(s, ["name","studentName","ชื่อ","ชื่อนักศึกษา"])).trim();
      const status = normalizeStatus(getField(s, ["status","สถานะ"]));

      if (!id || !name) return;

      s._id = id;
      s._name = name;
      s._status = status;

      const option = document.createElement("option");
      option.value = String(index);
      option.textContent = `${id} - ${name} (${status})`;
      option.disabled = status === "ส่งแล้ว";
      studentSelect.appendChild(option);
    });

    studentSelect.disabled = false;
    submitButton.disabled = false;
    loadStatus.textContent = "โหลดรายชื่อนักศึกษาสำเร็จ";
    loadStatus.className = "status success";

    if (studentSelect.options.length <= 1) {
      loadStatus.textContent = "ไม่พบข้อมูลนักศึกษา กรุณาตรวจสอบ Google Sheets";
      submitButton.disabled = true;
    }
  } catch (error) {
    loadStatus.textContent = "โหลดข้อมูลไม่สำเร็จ: " + error.message;
    loadStatus.className = "status error";
    studentSelect.innerHTML = '<option value="">ไม่สามารถโหลดรายชื่อได้</option>';
    submitButton.disabled = true;
  }
}

studentSelect.addEventListener("change", function() {
  const s = students[Number(this.value)];

  if (!s) {
    studentId.value = "";
    studentName.value = "";
    studentStatus.value = "";
    return;
  }

  studentId.value = s._id;
  studentName.value = s._name;
  studentStatus.value = s._status;

  if (s._status === "ส่งแล้ว") {
    submitButton.disabled = true;
  } else {
    submitButton.disabled = false;
  }
});

document.getElementById("submitForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const selected = students[Number(studentSelect.value)];
  if (!selected) {
    alert("กรุณาเลือกรายชื่อนักศึกษาก่อนค่ะ");
    return;
  }

  if (selected._status === "ส่งแล้ว") {
    alert("นักศึกษาคนนี้ส่งงานแล้วค่ะ");
    return;
  }

  const link = document.getElementById("workLink").value.trim();

  if (!/^https?:\/\//i.test(link)) {
    alert("กรุณากรอกลิงก์ผลงานที่ถูกต้อง");
    return;
  }

  submitButton.disabled = true;
  submitButton.textContent = "กำลังส่งข้อมูล...";

  try {
    const response = await fetch(API_URL + "/submit", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        studentId: selected._id,
        studentName: selected._name,
        subject: "DBI223-224",
        assignmentName: "Week 5",
        workLink: link
      })
    });

    const result = await response.json();

    if (!response.ok || result.ok !== true) {
      throw new Error(result.message || "ระบบไม่สามารถบันทึกข้อมูลได้");
    }

    alert("ส่งงานเรียบร้อยแล้ว! 🎉");
    document.getElementById("workLink").value = "";
    await loadStudents();

  } catch (error) {
    alert("ส่งงานไม่สำเร็จ: " + error.message);
  } finally {
    submitButton.textContent = "ส่งงาน";
    submitButton.disabled = false;
  }
});

loadStudents();
</script>
</body>
</html>
