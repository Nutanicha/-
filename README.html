<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBI223-224 Student Assignment Hub</title>

<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 25px 15px;
  min-height: 100vh;
  font-family: 'Prompt', sans-serif;
  background: linear-gradient(135deg, #17152d, #292044, #40305e);
  color: #fff;
}

.container {
  max-width: 620px;
  margin: 35px auto;
  padding: 30px;
  background: rgba(255,255,255,0.08);
  border: 1px solid rgba(255,255,255,0.15);
  border-radius: 22px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.25);
}

h1 {
  text-align: center;
  font-size: 25px;
  margin: 0 0 8px;
}

.subtitle {
  text-align: center;
  color: #c9bedf;
  font-size: 14px;
  margin-bottom: 25px;
}

.info {
  background: rgba(190,160,255,0.12);
  border: 1px solid rgba(190,160,255,0.25);
  padding: 15px;
  border-radius: 13px;
  margin-bottom: 22px;
  line-height: 1.9;
  font-size: 14px;
}

label {
  display: block;
  margin: 17px 0 7px;
  font-size: 14px;
  color: #e8defc;
}

input, select {
  width: 100%;
  padding: 13px;
  border: 1px solid rgba(255,255,255,0.2);
  border-radius: 10px;
  background: #f8f6fc;
  color: #29213c;
  font-family: 'Prompt', sans-serif;
  font-size: 14px;
  outline: none;
}

input[readonly] {
  background: #e9e4f1;
  color: #55496b;
}

button {
  width: 100%;
  margin-top: 25px;
  padding: 14px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(90deg, #a987ef, #8064d8);
  color: white;
  font-family: 'Prompt', sans-serif;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
}

button:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}

.status {
  margin-top: 15px;
  padding: 12px;
  border-radius: 10px;
  text-align: center;
  font-size: 14px;
  background: rgba(255,255,255,0.08);
  color: #e8defc;
}

.status.error {
  color: #ffc2c2;
  background: rgba(255,70,70,0.12);
}

.status.success {
  color: #b9ffd1;
  background: rgba(50,200,110,0.12);
}

.footer {
  text-align: center;
  margin-top: 25px;
  color: #bcb1d1;
  font-size: 12px;
}

</style>
</head>

<body>

<div class="container">

  <h1>🦉 Student Assignment Hub</h1>
  <div class="subtitle">DBI223-224 | ระบบส่งงานนักศึกษา</div>

  <div class="info">
    📚 วิชา: DBI223-224<br>
    📝 งาน: Week 5<br>
    📅 กำหนดส่ง: 13/11/2569<br>
    <span id="studentCount">กำลังโหลดข้อมูลนักศึกษา...</span>
  </div>

  <form id="submitForm">

    <label for="studentSelect">👤 เลือกรายชื่อนักศึกษา</label>
    <select id="studentSelect" required>
      <option value="">กำลังโหลดรายชื่อ...</option>
    </select>

    <label for="studentId">📌 รหัสนักศึกษา</label>
    <input type="text" id="studentId" readonly required>

    <label for="studentName">👤 ชื่อ - นามสกุล</label>
    <input type="text" id="studentName" readonly required>

    <label for="assignmentName">📝 ชื่องาน</label>
    <input type="text" id="assignmentName" value="Week 5" readonly>

    <label for="workLink">🔗 ลิงก์ผลงาน</label>
    <input
      type="url"
      id="workLink"
      placeholder="https://..."
      required
    >

    <button type="submit" id="submitButton" disabled>
      📤 ส่งงาน
    </button>

  </form>

  <div id="message" class="status">
    กำลังเชื่อมต่อระบบ...
  </div>

  <div class="footer">
    DBI223-224 Student Assignment Hub
  </div>

</div>

<script>
const WORKER_URL =
  "https://owl-assignment-bot.bewrattanasri24.workers.dev";

const SUBJECT = "DBI223-224";
const ASSIGNMENT = "Week 5";

let students = [];

const studentSelect = document.getElementById("studentSelect");
const studentId = document.getElementById("studentId");
const studentName = document.getElementById("studentName");
const submitButton = document.getElementById("submitButton");
const message = document.getElementById("message");
const studentCount = document.getElementById("studentCount");

function showMessage(text, type = "") {
  message.textContent = text;
  message.className = "status " + type;
}

async function loadStudents() {
  studentSelect.innerHTML =
    '<option value="">กำลังโหลดรายชื่อ...</option>';

  submitButton.disabled = true;

  try {
    const response = await fetch(WORKER_URL + "/students");
    const data = await response.json();

    if (!response.ok || !data.ok) {
      throw new Error(data.message || "โหลดรายชื่อไม่สำเร็จ");
    }

    students = Array.isArray(data.students) ? data.students : [];

    studentSelect.innerHTML =
      '<option value="">-- เลือกรายชื่อนักศึกษา --</option>';

    students.forEach((student, index) => {
      const option = document.createElement("option");

      const id = String(student.studentId || "").trim();
      const name = String(student.studentName || "").trim();
      const status = String(student.status || "ยังไม่ส่ง").trim();

      option.value = String(index);
      option.textContent =
        `${id} - ${name} (${status})`;

      if (status === "ส่งแล้ว") {
        option.disabled = true;
      }

      studentSelect.appendChild(option);
    });

    const submitted = students.filter(
      s => String(s.status).trim() === "ส่งแล้ว"
    ).length;

    studentCount.textContent =
      `นักศึกษาทั้งหมด ${students.length} คน | ส่งแล้ว ${submitted} คน | ยังไม่ส่ง ${students.length - submitted} คน`;

    showMessage("โหลดรายชื่อนักศึกษาเรียบร้อยแล้ว");

  } catch (error) {
    studentSelect.innerHTML =
      '<option value="">ไม่สามารถโหลดรายชื่อได้</option>';

    studentCount.textContent = "ไม่สามารถโหลดข้อมูลนักศึกษาได้";
    showMessage("❌ " + error.message, "error");
  }
}

studentSelect.addEventListener("change", function() {
  const index = this.value;

  studentId.value = "";
  studentName.value = "";
  submitButton.disabled = true;

  if (index === "") return;

  const student = students[Number(index)];

  if (!student) return;

  studentId.value = student.studentId;
  studentName.value = student.studentName;

  if (student.status === "ส่งแล้ว") {
    showMessage("นักศึกษาคนนี้ส่งงานแล้ว");
    return;
  }

  submitButton.disabled = false;
  showMessage("พร้อมส่งงาน");
});

document.getElementById("submitForm").addEventListener(
  "submit",
  async function(event) {
    event.preventDefault();

    const selected = studentSelect.value;

    if (selected === "") {
      showMessage("กรุณาเลือกรายชื่อนักศึกษา", "error");
      return;
    }

    const student = students[Number(selected)];
    const workLink = document.getElementById("workLink").value.trim();

    if (!student || student.status === "ส่งแล้ว") {
      showMessage("ไม่สามารถส่งงานด้วยรายชื่อนี้ได้", "error");
      return;
    }

    if (!/^https?:\/\/\S+/i.test(workLink)) {
      showMessage("กรุณากรอกลิงก์ผลงานที่ถูกต้อง", "error");
      return;
    }

    submitButton.disabled = true;
    submitButton.textContent = "กำลังส่งงาน...";

    try {
      const response = await fetch(WORKER_URL + "/submit", {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          studentId: student.studentId,
          studentName: student.studentName,
          subject: SUBJECT,
          assignmentName: ASSIGNMENT,
          workLink: workLink
        })
      });

      const result = await response.json();

      if (!response.ok || !result.ok) {
        throw new Error(result.message || "ส่งงานไม่สำเร็จ");
      }

      showMessage(
        "✅ ส่งงานเรียบร้อยแล้ว ระบบบันทึกข้อมูลสำเร็จ",
        "success"
      );

      document.getElementById("workLink").value = "";

      await loadStudents();

      studentSelect.value = "";
      studentId.value = "";
      studentName.value = "";

    } catch (error) {
      showMessage("❌ " + error.message, "error");
    } finally {
      submitButton.textContent = "📤 ส่งงาน";
      submitButton.disabled = true;
    }
  }
);

loadStudents();
</script>

</body>
</html>
