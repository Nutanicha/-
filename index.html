<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DBI223-224 Student Assignment Hub</title>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    :root {
      --lav: #eee9ff;
      --lav2: #ddd4ff;
      --purple: #7563c9;
      --deep: #51418f;
      --blue: #e6f3ff;
      --blue2: #cfe7ff;
      --cream: #fff8e9;
      --white: #fff;
      --ink: #393253;
      --muted: #89849e;
      --line: #eeeaf6;
      --green: #4caf91;
      --yellow: #e8ad52;
      --red: #d87988;
      --shadow: 0 12px 34px rgba(86, 69, 143, .08);
      --radius: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Prompt', sans-serif; background: #faf9ff; color: var(--ink); min-height: 100vh; }
    button, input, select { font: inherit; }

    .app { display: flex; min-height: 100vh; }
    .sidebar {
      width: 248px;
      background: #fff;
      border-right: 1px solid var(--line);
      padding: 26px 18px;
      display: flex;
      flex-direction: column;
      position: fixed;
      inset: 0 auto 0 0;
      z-index: 5;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px 28px; }
    .brand-mark { width: 42px; height: 42px; border-radius: 14px; background: var(--lav); display: grid; place-items: center; color: var(--deep); }
    .brand-mark i { width: 21px; height: 21px; }
    .brand strong { font-size: 15px; line-height: 1.25; display: block; color: var(--deep); }
    .brand small { font: 10px 'Fira Code'; color: var(--muted); }

    .nav-label { font-size: 10px; letter-spacing: 1.5px; color: #aaa4bb; padding: 10px 12px; }
    .nav { display: grid; gap: 7px; }
    .nav button {
      border: 0;
      background: transparent;
      color: #827d96;
      padding: 12px 14px;
      border-radius: 13px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 13px;
      cursor: pointer;
      transition: .2s;
      font-size: 13px;
    }
    .nav button i { width: 18px; height: 18px; }
    .nav button:hover { background: #f8f5ff; color: var(--deep); }
    .nav button.active { background: var(--lav); color: var(--deep); font-weight: 600; }

    .sidebar-bottom {
      margin-top: auto;
      background: var(--cream);
      border-radius: 18px;
      padding: 14px;
      font-size: 11px;
      color: #8b795c;
      line-height: 1.6;
    }
    .sidebar-bottom strong { display: block; color: #6d5b40; font-size: 12px; margin-bottom: 3px; }

    .main { margin-left: 248px; width: calc(100% - 248px); padding: 28px 34px 45px; max-width: 1600px; }
    .topbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 26px; gap: 16px; }
    .eyebrow { font: 10px 'Fira Code'; color: var(--purple); letter-spacing: 1.4px; text-transform: uppercase; margin-bottom: 5px; }
    h1 { font-size: 25px; color: var(--deep); font-weight: 600; }
    .subhead { font-size: 12px; color: var(--muted); margin-top: 3px; }
    .top-right { display: flex; align-items: center; gap: 10px; }
    .pill { background: #fff; border: 1px solid var(--line); padding: 9px 13px; border-radius: 30px; font-size: 11px; color: #77718e; display: flex; align-items: center; gap: 7px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); display: inline-block; }
    .avatar { width: 38px; height: 38px; border-radius: 13px; background: var(--lav); display: grid; place-items: center; color: var(--deep); }

    .page { display: none; }
    .page.active { display: block; }
    .grid { display: grid; gap: 18px; }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); margin-bottom: 18px; }
    .stat { border-radius: var(--radius); padding: 20px 22px; box-shadow: var(--shadow); position: relative; overflow: hidden; min-height: 125px; }
    .stat:nth-child(1) { background: var(--lav); }
    .stat:nth-child(2) { background: var(--blue); }
    .stat:nth-child(3) { background: var(--cream); }
    .stat-label { font-size: 12px; color: #77718e; }
