
<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DBI223-224 Student Assignment Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Fira+Code&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{margin:0;padding:25px 15px;font-family:'Prompt',sans-serif;background:linear-gradient(135deg,#f4efff,#e8e5ff);color:#30264a}
.container{max-width:650px;margin:auto;background:white;padding:30px;border-radius:22px;box-shadow:0 10px 35px #51408020}
h1{text-align:center;color:#7354b8;font-size:25px}
.subtitle{text-align:center;color:#827895;margin-bottom:25px}
label{display:block;margin:16px 0 7px;font-weight:500}
input,select{width:100%;padding:13px;border:1px solid #ddd5ef;border-radius:10px;font-family:inherit;font-size:15px;background:#fff}
input[readonly]{background:#f5f2fb;color:#65577f}
button{width:100%;margin-top:22px;padding:14px;border:0;border-radius:12px;background:#7957bd;color:white;font-family:inherit;font-size:16px;font-weight:600;cursor:pointer}
button:disabled{opacity:.55;cursor:not-allowed}
.status{margin-top:15px;padding:12px;border-radius:10px;background:#f5f2fb;text-align:center;font-size:14px}
.note{font-size:13px;color:#887e9a;text-align:center;margin-top:18px}
.error{color:#c0392b}
.success{color:#218653}
.refresh{margin-top:8px;background:#eee8fa;color:#63469c;font-size:13px;padding:9px}
</style>
</head>

<body>
<div class="container">
  <h1>🦉 Student Assignment Hub</h1>
  <div class="subtitle">DBI223-224 ระบบส่งงานนักศึกษา</div>

  <div id="loadStatus" class="status">กำลังเชื่อมต่อ Google Sheets...</div>
  <button type="button" id="refreshButton" class="refresh" onclick="loadStudents()">↻ อัปเดตข้อมูล</button>

  <form id="submitForm">
    <label for="studentSelect">👤 เลือกรายชื่อนักศึกษา</label>
    <select id="studentSelect" required disabled>
      <option value="">กำลังโหลดข้อมูล...</option>
    </select>

    <label for="studentId">📌 รหัสนักศึกษา</label>
    <input id="studentId" type="text" readonly required>

    <label for="studentName">👤 ชื่อ - นามสกุล</label>
    <input id="studentName" type="text" readonly required>

    <label for="studentStatus">📋 สถานะการส่งงาน</label>
    <input id="studentStatus" type="text" readonly>

    <label for="assignmentName">📝 ชื่องาน</label>
    <select id="assignmentName" required>
      <option value="Week 5">Week 5</option>
    </select>

    <label for="workLink">🔗 ลิงก์ผลงาน</label>
    <input id="workLink" type="url" placeholder="https://..." required>

    <button id="submitButton" type="submit" disabled>ส่งงาน</button>
  </form>

  <div class="note">กำหนดส่ง 13/11/2569 · DBI223-224</div>
</div>

<script>
const API_URL = "https://owl-assignment-bot.bewrattanasri24.workers.dev";
const REFRESH_INTERVAL = 15000;

const studentSelect = document.getElementById("studentSelect");
const studentId = document.getElementById("studentId");
const studentName = document.getElementById("studentName");
const studentStatus = document.getElementById("studentStatus");
const loadStatus = document.getElementById("loadStatus");
const submitButton = document.getElementById("submitButton");
const refreshButton = document.getElementById("refreshButton");

let students = [];
let isSubmitting = false;
let isLoading = false;

function updateSubmitButton() {
  const index = studentSelect.value;
  const student = index === "" ? null : students[Number(index)];

  submitButton.disabled =
    isSubmitting || !student || student.status !== "ยังไม่ส่ง";
}

function clearSelectedStudent() {
  studentSelect.value = "";
  studentId.value = "";
  studentName.value = "";
  studentStatus.value = "";
  updateSubmitButton();
}

function showSelectedStudent() {
  const index = studentSelect.value;
  const student = index === "" ? null : students[Number(index)];

  if (!student) {
    studentId.value = "";
    studentName.value = "";
    studentStatus.value = "";
    updateSubmitButton();
    return;
  }

  studentId.value = student.studentId;
  studentName.value = student.studentName;
  studentStatus.value = student.status;
  updateSubmitButton();
}

async function loadStudents() {
  if (isLoading || isSubmitting) return;
  isLoading = true;
  refreshButton.disabled = true;

  const previousId = studentId.value;

  try {
    const response = await fetch(API_URL + "/students", {
      method: "GET",
      cache: "no-store"
    });

    const result = await response.json();

    if (!response.ok || result.ok !== true || !Array.isArray(result.students)) {
      throw new Error(result.message || "ไม่สามารถอ่านข้อมูลจาก Google Sheets ได้");
    }

    students = result.students.map(s => ({
      studentId: String(s.studentId || "").trim(),
      studentName: String(s.studentName || "").trim(),
      status: String(s.status || "").trim()
    }));

    studentSelect.innerHTML =
      '<option value="">-- เลือกรายชื่อนักศึกษา --</option>';

    students.forEach((student, index) => {
      const option = document.createElement("option");
      option.value = String(index);
      option.textContent =
        `${student.studentId} - ${student.studentName} (${student.status})`;

      if (student.status === "ส่งแล้ว") {
        option.disabled = true;
      }

      studentSelect.appendChild(option);
    });

    studentSelect.disabled = false;

    const selectedIndex = students.findIndex(s => s.studentId === previousId);

    if (selectedIndex >= 0) {
      studentSelect.value = String(selectedIndex);
    } else {
      studentSelect.value = "";
    }

    showSelectedStudent();

    loadStatus.textContent =
      `เชื่อมต่อสำเร็จ · ${students.length} คน · ${result.subject} · ${result.assignmentName} · กำหนดส่ง ${result.dueDate}`;
    loadStatus.className = "status success";

  } catch (error) {
    loadStatus.textContent = "โหลดข้อมูลไม่สำเร็จ: " + error.message;
    loadStatus.className = "status error";
    studentSelect.disabled = true;
    submitButton.disabled = true;
  } finally {
    isLoading = false;
    refreshButton.disabled = false;
  }
}

studentSelect.addEventListener("change", showSelectedStudent);

document.getElementById("submitForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const index = studentSelect.value;
  const student = index === "" ? null : students[Number(index)];

  if (!student || student.status !== "ยังไม่ส่ง") {
    alert("กรุณาเลือกนักศึกษาที่ยังไม่ส่งงาน");
    return;
  }

  const workLink = document.getElementById("workLink").value.trim();

  if (!/^https?:\/\//i.test(workLink)) {
    alert("กรุณากรอกลิงก์ผลงานให้ถูกต้อง");
    return;
  }

  isSubmitting = true;
  submitButton.disabled = true;
  refreshButton.disabled = true;
  submitButton.textContent = "กำลังส่งงาน...";

  try {
    const response = await fetch(API_URL + "/submit", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        studentId: student.studentId,
        studentName: student.studentName,
        subject: "DBI223-224",
        assignmentName: "Week 5",
        workLink: workLink
      })
    });

    const result = await response.json();

    if (!response.ok || result.ok !== true) {
      throw new Error(result.message || "ระบบบันทึกข้อมูลไม่สำเร็จ");
    }

    alert("ส่งงานเรียบร้อยแล้ว 🎉");
    document.getElementById("workLink").value = "";
    clearSelectedStudent();

  } catch (error) {
    alert("ส่งงานไม่สำเร็จ: " + error.message);
  } finally {
    isSubmitting = false;
    submitButton.textContent = "ส่งงาน";
    refreshButton.disabled = false;
    await loadStudents();
  }
});

loadStudents();
setInterval(loadStudents, REFRESH_INTERVAL);
</script>
</body>
</html>
